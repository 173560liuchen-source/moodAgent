<!doctype html>
<html lang="zh-CN">
<head><script src="auth-guard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>心晴 AI · 情绪分析</title>
  <style>html{background:#f6f2ea}</style>
  <script src="page-transition.js" defer></script>
  <style>
    :root{--canvas:#f6f2ea;--surface:rgba(255,253,249,.78);--surface-strong:#fffdf9;--ink:#25302a;--deep:#2e4335;--muted:#657269;--sage:#5c7a63;--sage-dark:#43604b;--mint:#e5eee6;--line:#e4decf;--rose:#a96d68;--amber:#a37a3e;--slate:#6b7f86;--shadow:0 18px 46px -29px rgba(46,67,53,.34)}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;background:var(--canvas);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.app{position:relative;isolation:isolate;height:100%;overflow:hidden;background:radial-gradient(ellipse at 88% 14%,rgba(220,235,218,.72),transparent 31%),radial-gradient(ellipse at 8% 90%,rgba(246,230,218,.66),transparent 34%)}.app:before,.app:after{position:fixed;z-index:-1;border-radius:50%;filter:blur(12px);pointer-events:none;content:""}.app:before{width:420px;height:420px;right:-120px;top:-150px;background:rgba(211,230,211,.46)}.app:after{width:330px;height:330px;left:-170px;bottom:-180px;background:rgba(239,210,190,.42)}
    .top{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;border-bottom:1px solid rgba(228,222,207,.86);background:rgba(246,242,234,.55);backdrop-filter:blur(14px)}.title-wrap{display:flex;align-items:baseline;gap:12px}.page-title{font:500 1.35rem Georgia,"Noto Serif SC",serif}.page-sub{color:var(--muted);font-size:.78rem}.home-link{color:var(--sage-dark);text-decoration:none}.home-link:hover{text-decoration:underline}
    .emotion-content{display:flex;height:calc(100dvh - 72px);min-height:0;flex-direction:column;gap:9px;padding:10px 26px 18px;overflow:hidden}.surface{border:1px solid rgba(255,255,255,.84);border-radius:18px;background:var(--surface);box-shadow:var(--shadow);backdrop-filter:blur(16px)}
    .snapshot{display:grid;grid-template-columns:minmax(300px,1.2fr) minmax(500px,1.8fr) auto;align-items:stretch;gap:8px;min-height:100px}.snapshot-main{position:relative;min-width:0;padding:12px 16px;overflow:hidden}.snapshot-main:after{position:absolute;right:-45px;bottom:-92px;width:180px;height:180px;border-radius:50%;background:var(--mint);content:""}.snapshot-label{position:relative;z-index:1;display:flex;align-items:center;gap:7px;color:var(--muted);font-size:.64rem;font-weight:750}.snapshot-label i{width:8px;height:8px;border-radius:50%;background:var(--sage);box-shadow:0 0 0 4px rgba(92,122,99,.12)}.snapshot-title{position:relative;z-index:1;margin:5px 0 2px;color:var(--sage-dark);font:500 1.25rem/1.2 Georgia,"Noto Serif SC",serif}.snapshot-copy{position:relative;z-index:1;max-width:88%;margin:0;color:var(--muted);font-size:.68rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.score-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.score-tile{min-width:0;padding:10px 11px}.score-tile span{display:block;color:var(--muted);font-size:.61rem}.score-tile strong{display:block;margin:2px 0 5px;color:var(--deep);font-size:.86rem;font-variant-numeric:tabular-nums}.mini-bar{height:4px;border-radius:99px;background:#e5e9e3;overflow:hidden}.mini-bar i{display:block;width:var(--value,0%);height:100%;border-radius:inherit;background:var(--tone,var(--sage))}
    .record-picker{position:relative;min-width:190px}.record-trigger{display:flex;width:100%;height:100%;min-height:100px;align-items:center;justify-content:space-between;gap:12px;padding:12px 15px;border:1px solid rgba(255,255,255,.84);border-radius:18px;background:var(--surface);box-shadow:var(--shadow);color:var(--ink);text-align:left;cursor:pointer}.record-trigger:focus-visible,.tab:focus-visible,.history-item:focus-visible{outline:0;box-shadow:0 0 0 3px rgba(92,122,99,.18)}.record-trigger small{display:block;color:var(--muted);font-size:.61rem}.record-trigger b{display:block;margin-top:4px;font-size:.75rem}.record-trigger:after{width:8px;height:8px;border-right:1.5px solid var(--sage);border-bottom:1.5px solid var(--sage);content:"";transform:rotate(45deg) translateY(-2px)}.record-menu{position:absolute;z-index:40;top:calc(100% + 7px);right:0;width:310px;max-height:320px;margin:0;padding:6px;border:1px solid rgba(76,96,82,.13);border-radius:15px;background:rgba(255,253,249,.98);box-shadow:0 22px 44px -22px rgba(46,67,53,.42);list-style:none;overflow:auto;scrollbar-width:none;opacity:0;pointer-events:none;transform:translateY(-5px);transition:opacity .16s ease,transform .16s ease}.record-menu::-webkit-scrollbar{display:none}.record-picker.open .record-menu{opacity:1;pointer-events:auto;transform:none}.record-note{margin:3px 3px 6px;padding:7px 8px;border-radius:9px;background:rgba(236,228,207,.56);color:var(--muted);font-size:.61rem;line-height:1.5}.record-option{display:grid;grid-template-columns:1fr auto;width:100%;gap:3px 10px;padding:9px 10px;border:0;border-radius:10px;background:transparent;color:var(--ink);text-align:left;cursor:pointer}.record-option:hover,.record-option[aria-selected=true]{background:var(--mint)}.record-option b{font-size:.72rem}.record-option time,.record-option span{color:var(--muted);font-size:.61rem}.record-option em{grid-row:1/3;grid-column:2;align-self:center;color:var(--sage-dark);font-size:.62rem;font-style:normal}
    .trend-panel{display:flex;min-height:0;flex:0 0 292px;flex-direction:column}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:50px;padding:9px 15px;border-bottom:1px solid rgba(228,222,207,.75)}.panel-head h2{margin:0;font-size:.9rem}.legend{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:.62rem}.legend span{display:flex;align-items:center;gap:5px}.legend i{width:14px;height:3px;border-radius:99px;background:var(--tone)}.trend-summary{margin-left:auto;color:var(--sage-dark);font-size:.65rem;font-weight:700}.chart-wrap{position:relative;flex:1;min-height:0;padding:10px 16px 12px}.trend-chart{display:block;width:100%;height:100%;min-height:210px}.grid-line{stroke:#dfe3dc;stroke-width:1}.axis-label{fill:#7b877f;font:9px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.series-line{fill:none;stroke:var(--tone);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.series-dot{fill:#fffdf9;stroke:var(--tone);stroke-width:1.7}.series-dot.selected{stroke-width:3;r:4.8}.chart-empty{display:grid;place-items:center;height:100%;color:var(--muted);font-size:.72rem}
    .detail-panel{display:flex;flex:1;min-height:0;flex-direction:column}.tabs{display:flex;align-items:center;gap:3px;min-height:48px;padding:6px 10px;border-bottom:1px solid rgba(228,222,207,.75)}.tab{min-height:36px;padding:0 14px;border:0;border-radius:10px;background:transparent;color:var(--muted);font-size:.7rem;font-weight:700;cursor:pointer}.tab:hover{background:rgba(229,238,230,.55);color:var(--deep)}.tab.active{background:var(--mint);color:var(--sage-dark)}.detail-status{margin-left:auto;padding-right:7px;color:var(--muted);font-size:.63rem}.tab-content{flex:1;min-height:0;padding:12px 15px 15px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}.tab-content::-webkit-scrollbar{display:none}.tab-pane{display:none;height:100%}.tab-pane.active{display:block}
    .detail-grid{display:grid;grid-template-columns:1.05fr .9fr 1.15fr;gap:8px;height:100%;min-height:0;padding:8px}.detail-section{display:flex;min-width:0;min-height:0;flex-direction:column;border:1px solid rgba(228,222,207,.72);border-radius:14px;background:rgba(255,255,255,.38);overflow:hidden}.detail-section-head{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px;padding:8px 11px;border-bottom:1px solid rgba(228,222,207,.68)}.detail-section-head h2{margin:0;font-size:.75rem}.detail-section-head span{color:var(--muted);font-size:.6rem;white-space:nowrap}.detail-section-body{flex:1;min-height:0;padding:8px;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none}.detail-section-body::-webkit-scrollbar{display:none}.composition{display:grid;grid-template-columns:1fr 1fr;gap:7px}.dimension-card{display:flex;min-height:76px;flex-direction:column;justify-content:space-between;padding:9px 10px;border:1px solid rgba(228,222,207,.72);border-radius:11px;background:rgba(255,255,255,.5)}.dimension-card header{display:flex;align-items:center;justify-content:space-between;color:var(--muted);font-size:.62rem}.dimension-card strong{font-size:.9rem;font-variant-numeric:tabular-nums}.dimension-card p{margin:4px 0;color:var(--muted);font-size:.58rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dimension-card .mini-bar{height:5px}
    .evidence-list,.history-list{display:grid;align-content:start;gap:7px}.evidence-item{display:flex;gap:8px;padding:9px 10px;border-radius:10px;background:rgba(229,238,230,.6);color:#536158;font-size:.64rem}.evidence-item:before{color:var(--sage);content:"“";font:700 1.1rem/1 Georgia,serif}.empty{display:grid;place-items:center;height:100%;min-height:100px;color:var(--muted);font-size:.66rem;text-align:center}.analysis-grid{display:grid;grid-template-columns:1fr;gap:7px}.analysis-card{padding:10px 11px;border:1px solid rgba(228,222,207,.72);border-radius:11px;background:rgba(255,255,255,.5)}.analysis-card h3{margin:0 0 5px;font-size:.7rem}.analysis-card p{margin:0;color:var(--muted);font-size:.62rem;line-height:1.58}.status-list{display:grid;grid-template-columns:1fr 1fr;gap:5px}.status-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 8px;border-radius:8px;background:var(--mint);font-size:.59rem}.status-row span{color:var(--muted)}.status-row b{font-size:.61rem}.related-actions{display:flex;gap:6px;margin-top:8px}.related-actions a{display:inline-flex;align-items:center;justify-content:center;min-height:34px;padding:0 10px;border:1px solid var(--line);border-radius:9px;background:rgba(255,255,255,.7);color:var(--deep);font-size:.61rem;font-weight:700;text-decoration:none}.related-actions a.primary{border-color:transparent;background:var(--sage);color:#f4f8f3}
    .history-list{grid-template-columns:repeat(2,1fr)}.history-item{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 11px;border:1px solid rgba(228,222,207,.7);border-radius:12px;background:rgba(255,255,255,.45);color:inherit;text-align:left;cursor:pointer}.history-item:hover,.history-item.active{border-color:rgba(92,122,99,.22);background:var(--mint)}.history-item b{font-size:.71rem}.history-item time,.history-item span{color:var(--muted);font-size:.61rem}.history-item em{grid-row:1/3;grid-column:2;align-self:center;color:var(--sage-dark);font-size:.64rem;font-style:normal}
    .snapshot-main,.score-tile,.trend-panel,.detail-panel{border:1px solid rgba(255,255,255,.84);border-radius:18px;background:var(--surface);box-shadow:var(--shadow);backdrop-filter:blur(16px)}.app.sidebar-open>.emotion-content{margin-left:var(--rail-open);width:calc(100% - var(--rail-open))}.app:not(.sidebar-open)>.emotion-content{margin-left:var(--rail);width:calc(100% - var(--rail))}.app>.emotion-content{transition:margin-left 260ms var(--nav-ease),width 260ms var(--nav-ease)}
    @media(max-width:1100px){body{overflow:auto}.app{height:auto;min-height:100%}.emotion-content{height:auto;min-height:calc(100dvh - 72px);overflow:visible}.snapshot{grid-template-columns:1fr}.record-trigger{min-height:72px}.trend-panel{flex-basis:310px}.detail-panel{min-height:480px}.detail-grid{grid-template-columns:1fr 1fr}.detail-section.analysis-section{grid-column:1/-1;min-height:230px}}@media(max-width:860px){.app.sidebar-open>.emotion-content{margin-left:min(86vw,var(--rail-open));width:calc(100% - min(86vw,var(--rail-open)))}.emotion-content{padding:14px}.page-sub{display:none}}@media(max-width:650px){.mood-sidebar.is-open{width:var(--rail)}.app.sidebar-open>.emotion-content,.app:not(.sidebar-open)>.emotion-content{margin-left:var(--rail);width:calc(100% - var(--rail))}.score-strip,.composition,.history-list,.analysis-grid,.detail-grid{grid-template-columns:1fr}.detail-section.analysis-section{grid-column:auto}.record-menu{left:0;right:auto;width:min(310px,calc(100vw - 110px))}.legend{display:none}.top{padding:0 18px}.home-link{display:none}}@media(max-width:460px){.score-strip,.composition,.history-list,.analysis-grid{grid-template-columns:1fr}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}@media(prefers-reduced-transparency:reduce){.snapshot-main,.score-tile,.record-trigger,.trend-panel,.detail-panel{backdrop-filter:none;background:#faf8f2}}
  </style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="title-wrap"><span class="page-title">情绪分析</span><span class="page-sub">对话情绪理解 · 证据可追溯</span></div>
    <a class="home-link" href="index.html">返回首页</a>
  </header>
  <section class="emotion-content content" id="main">
    <div class="snapshot">
      <article class="snapshot-main">
        <div class="snapshot-label"><i></i><span id="snapshot-state">正在读取当前情绪</span></div>
        <h1 class="snapshot-title" id="emotion-title">等待分析</h1>
        <p class="snapshot-copy" id="emotion-copy">正在读取最近一次 EmotionAgent 分析结果。</p>
      </article>
      <div class="score-strip" id="score-strip"></div>
      <div class="record-picker" id="record-picker">
        <button class="record-trigger" id="record-trigger" type="button" aria-expanded="false"><span><small>选择分析记录</small><b id="record-label">最近一次</b></span></button>
        <div class="record-menu" id="record-menu" role="listbox"></div>
      </div>
    </div>

    <section class="trend-panel">
      <div class="panel-head">
        <h2>情绪变化趋势</h2>
        <div class="legend"><span style="--tone:#6b7f86"><i></i>焦虑</span><span style="--tone:#a37a3e"><i></i>压力</span><span style="--tone:#a96d68"><i></i>低落</span><span style="--tone:#5c7a63"><i></i>孤独</span></div>
        <span class="trend-summary" id="trend-summary">等待历史数据</span>
      </div>
      <div class="chart-wrap" id="trend-chart"><div class="chart-empty">正在读取情绪趋势…</div></div>
    </section>

    <section class="detail-panel">
      <div class="detail-grid">
        <section class="detail-section">
          <div class="detail-section-head"><h2>多维情绪构成</h2><span>4 个维度可同时存在</span></div>
          <div class="detail-section-body" id="tab-composition"></div>
        </section>
        <section class="detail-section">
          <div class="detail-section-head"><h2>原文识别依据</h2><span>来自用户表达</span></div>
          <div class="detail-section-body" id="tab-evidence"></div>
        </section>
        <section class="detail-section analysis-section">
          <div class="detail-section-head"><h2>分析说明</h2><span id="detail-status">等待数据</span></div>
          <div class="detail-section-body" id="tab-analysis"></div>
        </section>
      </div>
    </section>
  </section>
</main>
<script src="sidebar.js"></script>
<script src="emotion-analysis.js?v=20260826-valid-emotion-only"></script>
</body>
</html>
