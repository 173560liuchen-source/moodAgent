<!doctype html>
<html lang="zh-CN">
<head><script src="auth-guard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>心晴 AI · 服务状态</title>
  <script src="page-transition.js" defer></script>
  <style>
    :root{--paper:#f6f2ea;--surface:rgba(255,253,249,.76);--ink:#25302a;--deep:#2e4335;--muted:#657269;--sage:#5c7a63;--sage-dark:#43604b;--mint:#e5eee6;--line:#e4decf;--warn:#9b7336;--rose:#a6534b;--shadow:0 20px 50px -28px rgba(46,67,53,.32)}*{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:var(--paper);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.app{position:relative;isolation:isolate;min-height:100dvh;background:radial-gradient(ellipse at 88% 8%,rgba(220,235,218,.72),transparent 29%),radial-gradient(ellipse at 8% 90%,rgba(246,230,218,.65),transparent 32%)}.top{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;border-bottom:1px solid rgba(228,222,207,.86);background:rgba(246,242,234,.76);backdrop-filter:blur(16px)}.title-wrap{display:flex;align-items:baseline;gap:12px}.page-title{font:500 1.35rem Georgia,"Noto Serif SC",serif}.page-sub{color:var(--muted);font-size:.78rem}.home-link{color:var(--sage-dark);text-decoration:none}.home-link:hover{text-decoration:underline}.content{min-height:calc(100dvh - 72px);padding:18px 26px 28px}.app.sidebar-open>.content{margin-left:var(--rail-open);width:calc(100% - var(--rail-open))}.app:not(.sidebar-open)>.content{margin-left:var(--rail);width:calc(100% - var(--rail))}.app>.content{transition:margin-left 260ms var(--nav-ease),width 260ms var(--nav-ease)}.hero,.panel,.status-card,.story{border:1px solid rgba(255,255,255,.84);background:var(--surface);box-shadow:var(--shadow);backdrop-filter:blur(16px)}.hero{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:12px;padding:17px 19px;border-radius:19px}.eyebrow{display:flex;align-items:center;gap:7px;margin:0 0 4px;color:var(--sage-dark);font-size:.62rem;font-weight:800;letter-spacing:.12em}.eyebrow i,.dot{width:8px;height:8px;border-radius:50%;background:var(--sage);box-shadow:0 0 0 4px rgba(92,122,99,.12)}.hero h1{margin:0;color:var(--deep);font:500 1.45rem/1.2 Georgia,"Noto Serif SC",serif}.hero p:last-child{margin:5px 0 0;color:var(--muted);font-size:.72rem}.refresh{min-height:38px;padding:0 14px;border:0;border-radius:11px;background:var(--sage);color:#fff;font-weight:750;cursor:pointer}.refresh:disabled{opacity:.55;cursor:wait}.overview{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.status-card{min-height:105px;padding:14px;border-radius:16px}.status-card span{display:block;color:var(--muted);font-size:.64rem}.status-card strong{display:flex;align-items:center;gap:8px;margin:7px 0 4px;color:var(--deep);font-size:1rem}.status-card small{display:block;color:#849087;font-size:.6rem}.dot.warn{background:var(--warn);box-shadow:0 0 0 4px rgba(155,115,54,.12)}.dot.bad{background:var(--rose);box-shadow:0 0 0 4px rgba(166,83,75,.12)}.story{margin-bottom:12px;padding:14px 15px;border-radius:18px}.story-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}.story h2{margin:0;color:var(--deep);font-size:.85rem}.story p{margin:0;color:var(--muted);font-size:.62rem}.flow{display:flex;align-items:stretch;gap:8px;overflow-x:auto;padding:1px}.flow-step{position:relative;flex:1;min-width:130px;padding:10px 11px;border:1px solid rgba(228,222,207,.74);border-radius:12px;background:rgba(255,255,255,.5)}.flow-step:not(:last-child):after{position:absolute;top:50%;right:-6px;z-index:1;color:var(--sage);content:'→';font-weight:800}.flow-step b,.flow-step span{display:block}.flow-step b{color:var(--deep);font-size:.68rem}.flow-step span{margin-top:3px;color:var(--muted);font-size:.58rem}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}.panel{min-width:0;padding:14px 15px;border-radius:18px}.panel h2{margin:0;color:var(--deep);font-size:.85rem}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:11px}.panel-head span{color:var(--muted);font-size:.62rem}.service-list,.agent-list{display:grid;gap:8px}.service-row{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:9px;padding:10px;border:1px solid rgba(228,222,207,.74);border-radius:12px;background:rgba(255,255,255,.46)}.service-icon{display:grid;place-items:center;width:34px;height:34px;border-radius:10px;background:var(--mint);color:var(--sage-dark);font-size:.72rem;font-weight:850}.service-row strong,.service-row small{display:block}.service-row strong{font-size:.72rem}.service-row small{margin-top:2px;color:var(--muted);font-size:.6rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.badge{padding:4px 7px;border-radius:99px;background:#dfeade;color:var(--sage-dark);font-size:.57rem;font-weight:850}.badge.warn{background:#f4ead8;color:#8a6331}.badge.bad{background:#f2deda;color:#a4544d}.model-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.kv{padding:11px;border:1px solid rgba(228,222,207,.74);border-radius:12px;background:rgba(255,255,255,.46)}.kv span{display:block;color:var(--muted);font-size:.6rem}.kv strong{display:block;margin-top:4px;color:var(--deep);font-size:.75rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.agent-list{grid-template-columns:repeat(2,minmax(0,1fr))}.agent{padding:10px;border:1px solid rgba(228,222,207,.74);border-radius:12px;background:rgba(255,255,255,.46)}.agent-top{display:flex;align-items:center;justify-content:space-between;gap:7px}.agent strong{font-size:.7rem}.agent small{color:var(--muted);font-size:.56rem}.agent p{margin:6px 0 0;color:var(--muted);font-size:.58rem;line-height:1.45}.rag-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.empty{display:grid;place-items:center;min-height:100px;color:var(--muted);font-size:.7rem;text-align:center}@media(max-width:1120px){.overview{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}@media(max-width:860px){.content{padding:14px}.app.sidebar-open>.content{margin-left:min(86vw,var(--rail-open));width:calc(100% - min(86vw,var(--rail-open)))}.top{padding:0 18px}.page-sub{display:none}}@media(max-width:620px){.mood-sidebar.is-open{width:var(--rail)}.app.sidebar-open>.content,.app:not(.sidebar-open)>.content{margin-left:var(--rail);width:calc(100% - var(--rail))}.overview,.model-grid,.agent-list,.rag-summary{grid-template-columns:1fr}.hero{align-items:flex-start;flex-direction:column}.home-link{display:none}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<main class="app"><header class="top"><div class="title-wrap"><span class="page-title">服务状态</span><span class="page-sub">运行健康 · 模型可用性 · Agent 注册表</span></div><a class="home-link" href="app.html">返回会话中心</a></header><section class="content"><section class="hero"><div><p class="eyebrow"><i></i>MOOD AI · SYSTEM STATUS</p><h1>系统运行状态</h1><p id="updated-at">正在读取服务状态…</p></div><button class="refresh" id="refresh" type="button">刷新状态</button></section><section class="overview" id="overview"><div class="empty">正在读取健康检查…</div></section><section class="grid"><section class="panel"><div class="panel-head"><h2>服务检查</h2><span id="service-caption">—</span></div><div class="service-list" id="service-list"></div></section><section class="panel"><div class="panel-head"><h2>模型状态</h2><span id="model-caption">—</span></div><div class="model-grid" id="model-grid"></div></section><section class="panel"><div class="panel-head"><h2>Agent 注册表</h2><span id="agent-caption">—</span></div><div class="agent-list" id="agent-list"></div></section><section class="panel"><div class="panel-head"><h2>RAG 知识库状态</h2><span id="rag-caption">—</span></div><div class="rag-summary" id="rag-summary"></div></section></section></section></main>
<script src="sidebar.js"></script><script src="service-status.js"></script>
</body>
</html>
