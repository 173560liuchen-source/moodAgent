<!doctype html>
<html lang="zh-CN">
<head><script src="auth-guard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>心晴 AI · 聊天管理</title>
  <style>html{background:#F6F2EA}</style>
  <script src="page-transition.js" defer></script>
  <style>
    :root{--paper:#f6f2ea;--surface:rgba(255,255,255,.72);--surface-strong:#fffdf9;--ink:#25302a;--deep:#2e4335;--muted:#657269;--sage:#5c7a63;--sage-dark:#43604b;--mint:#e5eee6;--line:#e4decf;--warm:#9c684e;--warning:#a57532;--danger:#a6534b;--shadow:0 20px 50px -28px rgba(46,67,53,.32)}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{background:var(--paper);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.app{position:relative;isolation:isolate;min-height:100%;overflow-x:hidden;background:radial-gradient(ellipse at 88% 14%,rgba(220,235,218,.74),transparent 31%),radial-gradient(ellipse at 8% 88%,rgba(246,230,218,.7),transparent 34%)}.app:before,.app:after{position:fixed;z-index:-1;border-radius:50%;filter:blur(10px);pointer-events:none;content:""}.app:before{width:430px;height:430px;right:-120px;top:-140px;background:rgba(211,230,211,.52)}.app:after{width:350px;height:350px;left:-170px;bottom:-190px;background:rgba(239,210,190,.47)}
    .top{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;border-bottom:1px solid rgba(228,222,207,.86);background:rgba(246,242,234,.55);backdrop-filter:blur(14px)}.title-wrap{display:flex;align-items:baseline;gap:12px}.page-title{font:500 1.35rem Georgia,"Noto Serif SC",serif}.page-sub{color:var(--muted);font-size:.78rem}.top-actions{display:flex;align-items:center;gap:12px}.home-link{color:var(--sage-dark);text-decoration:none}.home-link:hover{text-decoration:underline}.clear-button{height:34px;padding:0 11px;border:1px solid rgba(166,83,75,.28);border-radius:10px;background:rgba(255,248,246,.78);color:var(--danger);font-size:.74rem;font-weight:700;cursor:pointer}.clear-button:hover:not(:disabled){background:#f9e8e5}.clear-button:disabled{opacity:.56;cursor:wait}.clear-button:focus-visible{outline:3px solid rgba(166,83,75,.18);outline-offset:2px}
    .content{display:flex;height:calc(100dvh - 72px);min-height:0;flex-direction:column;padding:18px 28px 24px;overflow:hidden}button{font:inherit}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:10px;margin-bottom:16px}.stat{padding:13px 15px;border:1px solid rgba(255,255,255,.78);border-radius:15px;background:rgba(255,255,255,.58);box-shadow:0 12px 28px -26px rgba(46,67,53,.5);backdrop-filter:blur(12px)}.stat span{display:block;color:var(--muted);font-size:.72rem}.stat strong{display:block;margin-top:3px;color:var(--deep);font-size:1.05rem;font-weight:650}
    .workspace{display:grid;grid-template-columns:260px minmax(360px,1fr) 320px;gap:14px;flex:1;min-height:0}.pane{min-width:0;min-height:0;border:1px solid rgba(255,255,255,.8);border-radius:20px;background:var(--surface);box-shadow:var(--shadow);backdrop-filter:blur(16px);overflow:hidden}.pane-head{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:62px;padding:14px 16px;border-bottom:1px solid rgba(228,222,207,.78)}.pane-head h2{margin:0;font-size:.98rem}.count{color:var(--muted);font-size:.72rem}
    .sessions-pane{display:flex;flex-direction:column}.filters{display:grid;gap:8px;padding:12px 12px 4px}.search{position:relative}.search svg{position:absolute;left:12px;top:12px;color:#7a887f}.search input,.filters select{width:100%;height:42px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.72);color:var(--ink);outline:0}.search input{padding:0 12px 0 38px}.filters select{padding:0 10px}.filter-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.session-list{flex:1;min-height:0;padding:8px 10px 14px;overflow-y:auto;overscroll-behavior:contain}.session-card{width:100%;margin:0 0 7px;padding:13px;border:1px solid transparent;border-radius:14px;background:transparent;color:inherit;text-align:left;cursor:pointer;transition:background .18s ease,border-color .18s ease,transform .18s ease}.session-card:hover{background:rgba(229,238,230,.62);transform:translateY(-1px)}.session-card.active{border-color:rgba(92,122,99,.22);background:rgba(229,238,230,.88)}.session-meta{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}.session-meta time{color:var(--muted);font-size:.7rem}.session-card h3{margin:0 0 5px;font-size:.88rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.session-card p{display:-webkit-box;margin:0;color:var(--muted);font-size:.76rem;overflow:hidden;-webkit-line-clamp:2;-webkit-box-orient:vertical}.badges{display:flex;gap:5px;margin-top:9px;flex-wrap:wrap}.badge{padding:3px 7px;border-radius:999px;background:#eef3ed;color:var(--sage-dark);font-size:.65rem}.badge.risk-medium{background:#f5ead7;color:#8b672f}.badge.risk-high{background:#f6dfdc;color:#974c45}
    .conversation-pane{display:flex;flex-direction:column}.conversation-head{align-items:flex-start}.conversation-title{min-width:0}.conversation-title h2{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.conversation-tools{display:flex;gap:6px}.ghost{height:34px;padding:0 11px;border:1px solid var(--line);border-radius:10px;background:rgba(255,255,255,.5);color:var(--muted);cursor:pointer}.ghost:hover{background:#fff;color:var(--deep)}.rounds{flex:1;min-height:0;padding:18px;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable}.round{position:relative;margin-bottom:24px;padding-left:32px}.round:before{position:absolute;left:8px;top:7px;bottom:-25px;width:1px;background:var(--line);content:""}.round:last-child:before{display:none}.round-no{position:absolute;left:0;top:0;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--sage);color:#fff;font-size:.62rem}.round-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}.round-top time{color:var(--muted);font-size:.7rem}.chain-button{padding:5px 9px;border:1px solid rgba(92,122,99,.2);border-radius:9px;background:rgba(229,238,230,.55);color:var(--sage-dark);font-size:.7rem;cursor:pointer}.chain-button:hover,.chain-button.active{background:var(--sage);color:#fff}.message{margin-bottom:9px}.role{display:block;margin-bottom:3px;color:#7c8980;font-size:.67rem;font-weight:700;letter-spacing:.08em}.bubble{padding:11px 13px;border-radius:13px;background:rgba(255,255,255,.72);color:#455249;white-space:pre-wrap;word-break:break-word}.message.user .bubble{border-left:3px solid rgba(92,122,99,.68);background:rgba(229,238,230,.72)}.message.assistant .bubble{border:1px solid rgba(228,222,207,.78)}
    .analysis-pane{display:flex;flex-direction:column}.analysis-body{flex:1;min-height:0;padding:16px;overflow-y:auto;overscroll-behavior:contain}.analysis-empty,.empty{display:grid;place-items:center;height:100%;padding:28px;color:var(--muted);text-align:center}.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}.summary{padding:10px;border:1px solid rgba(228,222,207,.72);border-radius:12px;background:rgba(255,255,255,.55)}.summary span{display:block;color:var(--muted);font-size:.66rem}.summary strong{display:block;margin-top:2px;font-size:.8rem;word-break:break-all}.section-label{margin:16px 0 9px;color:#78867d;font-size:.68rem;font-weight:750;letter-spacing:.12em}.chain{position:relative}.agent-step{position:relative;display:grid;grid-template-columns:24px 1fr auto;gap:9px;padding:0 0 14px}.agent-step:not(:last-child):before{position:absolute;left:11px;top:24px;bottom:0;width:1px;background:var(--line);content:""}.step-dot{display:grid;place-items:center;width:24px;height:24px;border:1px solid rgba(92,122,99,.22);border-radius:8px;background:#f7faf6;color:var(--sage);font-size:.66rem;font-weight:800}.step-main strong{display:block;font-size:.77rem}.step-main small{color:var(--muted);font-size:.66rem}.step-time{color:#738078;font-size:.66rem}.detail-card{margin-top:8px;padding:12px;border:1px solid rgba(228,222,207,.75);border-radius:13px;background:rgba(255,255,255,.52)}.detail-card h4{margin:0 0 7px;font-size:.77rem}.detail-card pre{max-height:220px;margin:0;overflow:auto;color:#536158;font:11px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;word-break:break-word}.loading{animation:pulse 1.1s ease-in-out infinite}@keyframes pulse{50%{opacity:.45}}
    .session-list,.rounds,.analysis-body,.detail-card pre{scrollbar-width:none;-ms-overflow-style:none}.session-list::-webkit-scrollbar,.rounds::-webkit-scrollbar,.analysis-body::-webkit-scrollbar,.detail-card pre::-webkit-scrollbar{display:none;width:0;height:0}
    .app.sidebar-open>.content{margin-left:var(--rail-open);width:calc(100% - var(--rail-open))}.app:not(.sidebar-open)>.content{margin-left:var(--rail);width:calc(100% - var(--rail))}.app>.content{transition:margin-left 260ms var(--nav-ease),width 260ms var(--nav-ease)}
    @media(max-width:1100px){.content{height:auto;min-height:calc(100dvh - 72px);overflow:visible}.workspace{grid-template-columns:250px minmax(360px,1fr);flex:none;min-height:640px}.analysis-pane{grid-column:1/-1;min-height:360px}.chain{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:0 18px}.agent-step:nth-child(odd):before{display:none}}@media(max-width:900px){.stats{grid-template-columns:1fr 1fr}.workspace{grid-template-columns:1fr}.session-list{min-height:260px;max-height:420px}.rounds{min-height:520px}.analysis-pane{grid-column:auto}.chain{grid-template-columns:1fr}.content{padding:18px 14px}.top{padding:0 18px}.page-sub{display:none}}@media(max-width:860px){.app.sidebar-open>.content{margin-left:min(86vw,var(--rail-open));width:calc(100% - min(86vw,var(--rail-open)))}}@media(max-width:560px){.mood-sidebar.is-open{width:var(--rail)}.app.sidebar-open>.content{margin-left:var(--rail);width:calc(100% - var(--rail))}.app.sidebar-open>.top{margin-left:var(--rail);width:calc(100% - var(--rail))}.side-brand,.side-caption,.nav-label,.side-foot span{display:none!important}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="title-wrap"><span class="page-title">聊天管理</span><span class="page-sub">记录查询 · 智能体链分析</span></div>
    <div class="top-actions"><button class="clear-button" id="clear-chat-records" type="button">清空聊天记录</button><a class="home-link" href="index.html">返回首页</a></div>
  </header>
  <section class="content">
    <div class="stats" aria-label="聊天记录概览">
      <div class="stat"><span>会话数量</span><strong id="stat-sessions">—</strong></div>
      <div class="stat"><span>对话轮次</span><strong id="stat-rounds">—</strong></div>
      <div class="stat"><span>最高风险</span><strong id="stat-risk">—</strong></div>
      <div class="stat"><span>链路记录</span><strong id="stat-events">—</strong></div>
    </div>
    <div class="workspace">
      <aside class="pane sessions-pane">
        <div class="pane-head"><h2>聊天记录</h2><span class="count" id="session-count">等待查询</span></div>
        <div class="filters">
          <label class="search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="keyword" placeholder="搜索会话内容" aria-label="搜索会话内容"></label>
          <div class="filter-row"><select id="date-filter" aria-label="时间范围"><option value="all">全部时间</option><option value="today">今天</option><option value="7d">近 7 天</option></select><select id="risk-filter" aria-label="风险等级"><option value="all">全部风险</option><option value="high">高风险</option><option value="medium">需关注</option><option value="low">低风险</option><option value="unknown">未识别</option></select></div>
        </div>
        <div class="session-list" id="session-list"><div class="empty">输入用户 ID 查询聊天记录</div></div>
      </aside>
      <section class="pane conversation-pane">
        <div class="pane-head conversation-head"><div class="conversation-title"><h2 id="conversation-title">会话详情</h2><span class="count" id="conversation-meta">选择左侧记录查看完整对话</span></div></div>
        <div class="rounds" id="round-list"><div class="empty">暂无选中的会话</div></div>
      </section>
      <aside class="pane analysis-pane">
        <div class="pane-head"><h2>本轮智能体链</h2><span class="count" id="analysis-status">等待选择</span></div>
        <div class="analysis-body" id="analysis-body"><div class="analysis-empty">点击一轮对话右上角的“查看智能体链”</div></div>
      </aside>
    </div>
  </section>
</main>
<script src="sidebar.js"></script>
<script src="chat-management.js?v=20260826-key-result-labels"></script>
</body>
</html>
