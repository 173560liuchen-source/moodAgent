<!doctype html>
<html lang="zh-CN">
<head><script src="auth-guard.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>心晴 AI · 审计日志</title>
  <style>html{background:#f6f2ea}</style>
  <script src="page-transition.js" defer></script>
  <style>
    :root{--paper:#f6f2ea;--surface:rgba(255,255,255,.72);--ink:#25302a;--deep:#2e4335;--muted:#657269;--sage:#5c7a63;--sage-dark:#43604b;--mint:#e5eee6;--line:#e4decf;--warning:#9a6e30;--danger:#a6534b;--shadow:0 20px 50px -28px rgba(46,67,53,.32)}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{background:var(--paper);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}.app{position:relative;isolation:isolate;min-height:100vh;overflow-x:hidden;background:radial-gradient(ellipse at 88% 12%,rgba(220,235,218,.74),transparent 31%),radial-gradient(ellipse at 7% 88%,rgba(246,230,218,.7),transparent 34%)}.app:before{position:fixed;z-index:-1;width:430px;height:430px;right:-120px;top:-140px;border-radius:50%;background:rgba(211,230,211,.52);filter:blur(10px);content:""}
    .top{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 34px;border-bottom:1px solid rgba(228,222,207,.86);background:rgba(246,242,234,.55);backdrop-filter:blur(14px)}.title-wrap{display:flex;align-items:baseline;gap:12px}.page-title{font:500 1.35rem Georgia,"Noto Serif SC",serif}.page-sub{color:var(--muted);font-size:.78rem}.home-link{color:var(--sage-dark);text-decoration:none}.home-link:hover{text-decoration:underline}
    .content{padding:22px 28px 32px}.explain{display:flex;align-items:center;gap:16px;margin-bottom:14px;padding:16px 18px;border:1px solid rgba(92,122,99,.16);border-radius:18px;background:linear-gradient(110deg,rgba(229,238,230,.9),rgba(255,255,255,.66));box-shadow:0 18px 38px -34px rgba(46,67,53,.55)}.explain-icon{display:grid;place-items:center;flex:0 0 42px;width:42px;height:42px;border-radius:14px;background:var(--sage);color:#fff;font-size:1.1rem}.explain h1{margin:0 0 3px;color:var(--deep);font-size:1rem}.explain p{margin:0;color:var(--muted);font-size:.78rem}.stats{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:12px;margin-bottom:16px}.stat{padding:15px 17px;border:1px solid rgba(255,255,255,.8);border-radius:16px;background:rgba(255,255,255,.62);box-shadow:0 12px 28px -26px rgba(46,67,53,.5);backdrop-filter:blur(12px)}.stat span{display:block;color:var(--muted);font-size:.72rem}.stat strong{display:block;margin-top:3px;color:var(--deep);font-size:1.12rem}.stat small{display:block;margin-top:2px;color:#87928a;font-size:.64rem}.stat.alert strong{color:var(--danger)}
    .workspace{display:grid;grid-template-columns:minmax(560px,1fr) 370px;gap:14px;min-height:calc(100vh - 162px)}.pane{min-width:0;border:1px solid rgba(255,255,255,.82);border-radius:20px;background:var(--surface);box-shadow:var(--shadow);backdrop-filter:blur(16px);overflow:hidden}.pane-head{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding:14px 17px;border-bottom:1px solid rgba(228,222,207,.78)}.pane-head h2{margin:0;font-size:.98rem}.count{color:var(--muted);font-size:.72rem}
    .filters{display:grid;grid-template-columns:minmax(220px,1fr) 150px 160px;gap:9px;padding:12px 14px;border-bottom:1px solid rgba(228,222,207,.66)}.search{position:relative}.search svg{position:absolute;left:12px;top:12px;color:#7a887f}.filters input,.filters select{width:100%;height:42px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.76);color:var(--ink);outline:0}.filters input{padding:0 12px 0 38px}.filters select{padding:0 10px}.filters input:focus,.filters select:focus{border-color:rgba(92,122,99,.55);box-shadow:0 0 0 3px rgba(92,122,99,.09)}
    .table-wrap{overflow:auto}.audit-table{width:100%;border-collapse:collapse;table-layout:fixed}.audit-table th{position:sticky;top:0;z-index:1;padding:11px 13px;background:rgba(248,246,240,.95);color:#78867d;font-size:.68rem;letter-spacing:.08em;text-align:left}.audit-table td{padding:13px;border-top:1px solid rgba(228,222,207,.62);font-size:.76rem;vertical-align:middle}.audit-row{cursor:pointer;transition:background .16s ease}.audit-row:hover,.audit-row.active{background:rgba(229,238,230,.62)}.audit-row.active{box-shadow:inset 3px 0 var(--sage)}.request{display:block;color:var(--deep);font:11px/1.4 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.subline{display:block;margin-top:3px;color:var(--muted);font-size:.67rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;background:#edf3ed;color:var(--sage-dark);font-size:.66rem}.pill:before{width:6px;height:6px;border-radius:50%;background:currentColor;content:""}.pill.partial{background:#f5ead7;color:var(--warning)}.pill.failed,.pill.review{background:#f6dfdc;color:var(--danger)}.model{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{display:grid;place-items:center;min-height:320px;padding:28px;color:var(--muted);text-align:center}.loading{animation:pulse 1.1s ease-in-out infinite}@keyframes pulse{50%{opacity:.45}}
    .detail-pane{display:flex;flex-direction:column}.detail-scroll{flex:1;padding:16px;overflow-y:auto}.detail-hero{padding:14px;border:1px solid rgba(92,122,99,.17);border-radius:15px;background:rgba(229,238,230,.58)}.detail-hero h3{margin:0 0 6px;color:var(--deep);font-size:.9rem}.detail-hero code{display:block;color:#536158;font:10px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;word-break:break-all}.detail-hero p{margin:8px 0 0;color:var(--muted);font-size:.72rem}.plain-conclusion{margin-top:10px;padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.62);color:#405348;font-size:.74rem}.section-label{margin:17px 0 8px;color:#78867d;font-size:.68rem;font-weight:750;letter-spacing:.12em}.section-help{display:block;margin:-5px 0 9px;color:#8a958e;font-size:.64rem}.result-help{display:block;margin:13px 0 9px;color:#8a958e;font-size:.64rem}.fact-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fact{padding:10px;border:1px solid rgba(228,222,207,.72);border-radius:12px;background:rgba(255,255,255,.55)}.fact span{display:block;color:var(--muted);font-size:.64rem}.fact strong{display:block;margin-top:2px;font-size:.76rem;word-break:break-word}.fact.wide{grid-column:1/-1}.ok{color:var(--sage-dark)}.warn{color:var(--warning)}.bad{color:var(--danger)}
    .flag-list{display:flex;flex-wrap:wrap;gap:6px}.flag{padding:5px 8px;border:1px solid rgba(92,122,99,.14);border-radius:9px;background:#f2f6f1;color:#536d58;font:10px/1.3 ui-monospace,SFMono-Regular,Consolas,monospace}.timeline{position:relative}.step{position:relative;display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:9px;padding-bottom:13px}.step:not(:last-child):before{position:absolute;left:11px;top:24px;bottom:0;width:1px;background:var(--line);content:""}.step-dot{display:grid;place-items:center;width:24px;height:24px;border:1px solid rgba(92,122,99,.22);border-radius:8px;background:#f7faf6;color:var(--sage);font-size:.64rem;font-weight:800}.step.failed .step-dot{border-color:rgba(166,83,75,.25);background:#fbefed;color:var(--danger)}.step-main{min-width:0}.step-main strong{display:block;font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.step-main small,.step-time{color:var(--muted);font-size:.64rem}.detail-card{margin-top:8px;padding:11px;border:1px solid rgba(228,222,207,.72);border-radius:12px;background:rgba(255,255,255,.52)}.detail-card summary{cursor:pointer;color:var(--deep);font-size:.73rem;font-weight:650}.detail-card pre{max-height:210px;margin:9px 0 0;overflow:auto;color:#536158;font:10px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
    .app.sidebar-open>.content{margin-left:var(--rail-open);width:calc(100% - var(--rail-open))}.app:not(.sidebar-open)>.content{margin-left:var(--rail);width:calc(100% - var(--rail))}.app>.content{transition:margin-left 260ms var(--nav-ease),width 260ms var(--nav-ease)}
    @media(max-width:1080px){.workspace{grid-template-columns:1fr}.detail-pane{min-height:520px}.stats{grid-template-columns:1fr 1fr}}@media(max-width:760px){.content{padding:16px 13px 26px}.top{padding:0 18px}.page-sub{display:none}.filters{grid-template-columns:1fr}.audit-table th:nth-child(3),.audit-table td:nth-child(3){display:none}.workspace{min-height:auto}}@media(max-width:860px){.app.sidebar-open>.content{margin-left:min(86vw,var(--rail-open));width:calc(100% - min(86vw,var(--rail-open)))}}@media(max-width:560px){.stats{grid-template-columns:1fr 1fr}.audit-table th:nth-child(4),.audit-table td:nth-child(4){display:none}.mood-sidebar.is-open{width:var(--rail)}.app.sidebar-open>.content{margin-left:var(--rail);width:calc(100% - var(--rail))}.app.sidebar-open>.top{margin-left:var(--rail);width:calc(100% - var(--rail))}.side-brand,.side-caption,.nav-label,.side-foot span{display:none!important}}
  </style>
</head>
<body>
<main class="app">
  <header class="top">
    <div class="title-wrap"><span class="page-title">审计日志</span><span class="page-sub">合规检查 · 异常追溯 · 版本快照</span></div>
    <a class="home-link" href="app.html">返回会话中心</a>
  </header>
  <section class="content">
    <section class="explain" aria-label="审计日志说明"><span class="explain-icon">✓</span><div><h1>每一次 AI 回答，都能说明“系统做了什么、是否安全、出了问题去哪查”</h1><p>这里只展示合规与异常证据，不重复展示用户的情绪、风险、画像或干预内容，也不保存聊天原文。</p></div></section>
    <div class="stats" aria-label="审计概览">
      <article class="stat"><span>已留下记录</span><strong id="stat-total">—</strong><small>每次回答都有据可查</small></article>
      <article class="stat alert"><span>执行有异常</span><strong id="stat-abnormal">—</strong><small>失败或未完整执行</small></article>
      <article class="stat"><span>建议人工介入</span><strong id="stat-review">—</strong><small>高风险场景交给专业人员</small></article>
      <article class="stat"><span>过程可追溯</span><strong id="stat-traced">—</strong><small>保留完整处理步骤</small></article>
    </div>
    <div class="workspace">
      <section class="pane">
        <div class="pane-head"><h2>AI 回答检查记录</h2><span class="count" id="record-count">正在读取</span></div>
        <div class="filters">
          <label class="search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="keyword" placeholder="搜索请求、会话或模型" aria-label="搜索审计记录"></label>
          <select id="status-filter" aria-label="执行状态"><option value="all">全部状态</option><option value="completed">执行完成</option><option value="partial">部分完成</option><option value="failed">执行失败</option><option value="unknown">状态未知</option></select>
          <select id="review-filter" aria-label="人工复核"><option value="all">全部复核状态</option><option value="yes">需要人工复核</option><option value="no">无需人工复核</option></select>
        </div>
        <div class="table-wrap" id="table-wrap"><div class="empty loading">正在读取审计记录…</div></div>
      </section>
      <aside class="pane detail-pane">
        <div class="pane-head"><h2>这次回答是否可信</h2><span class="count" id="detail-status">等待选择</span></div>
        <div class="detail-scroll" id="detail"><div class="empty">选择一条记录，即可看到这次回答是否安全、是否需要人工介入，以及系统是否按规则执行。</div></div>
      </aside>
    </div>
  </section>
</main>
<script src="sidebar.js"></script>
<script src="audit-log.js"></script>
</body>
</html>
