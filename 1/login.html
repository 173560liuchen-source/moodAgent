<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>登录 · 心晴 AI</title>
  <style>
    :root{--paper:#f6f2ea;--ink:#25302a;--muted:#68736b;--sage:#5c7a63;--deep:#2e4335;--mint:#e5eee6;--line:#e3ddcf;--danger:#a8554d}
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}body{display:grid;place-items:center;padding:28px;background:radial-gradient(circle at 80% 18%,rgba(217,234,219,.8),transparent 34%),radial-gradient(circle at 10% 85%,rgba(245,225,211,.72),transparent 35%),var(--paper);color:var(--ink);font:15px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.shell{display:grid;grid-template-columns:minmax(270px,420px) minmax(340px,460px);width:min(920px,100%);min-height:590px;overflow:hidden;border:1px solid rgba(255,255,255,.8);border-radius:28px;background:rgba(255,255,255,.7);box-shadow:0 30px 70px -30px rgba(46,67,53,.38);backdrop-filter:blur(18px)}.intro{display:flex;flex-direction:column;justify-content:space-between;padding:42px;background:linear-gradient(145deg,rgba(92,122,99,.98),rgba(46,67,53,.98));color:#edf5ed}.brand{display:flex;align-items:center;gap:12px;font:600 1.25rem Georgia,serif}.mark{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:rgba(255,255,255,.16)}.intro h1{margin:50px 0 18px;font:400 2.35rem/1.15 Georgia,serif}.intro p{margin:0;color:rgba(237,245,237,.78)}.privacy{font-size:.78rem}.panel{padding:42px}.back{color:var(--sage);text-decoration:none}.panel h2{margin:56px 0 7px;font:400 2rem/1.15 Georgia,serif}.hint{margin:0 0 24px;color:var(--muted)}.tabs{display:flex;gap:6px;margin-bottom:22px;padding:4px;border-radius:12px;background:#eef2ed}.tab{flex:1;padding:9px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:700;cursor:pointer}.tab.active{background:#fff;color:var(--deep);box-shadow:0 5px 14px -10px rgba(46,67,53,.7)}form{display:grid;gap:15px}label{display:grid;gap:6px;color:var(--deep);font-size:.82rem;font-weight:700}input{width:100%;height:46px;padding:0 13px;border:1px solid var(--line);border-radius:11px;background:rgba(255,255,255,.9);color:var(--ink);font:inherit}input:focus{outline:0;border-color:var(--sage);box-shadow:0 0 0 3px rgba(92,122,99,.13)}.nickname{display:none}.register-mode .nickname{display:grid}.submit{height:48px;margin-top:5px;border:0;border-radius:12px;background:var(--sage);color:#f4faf4;font-weight:750;cursor:pointer}.submit:disabled{opacity:.6;cursor:wait}.message{min-height:24px;margin:4px 0 0;color:var(--danger);font-size:.8rem}.security{margin-top:25px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:.75rem}@media(max-width:760px){body{padding:14px}.shell{grid-template-columns:1fr}.intro{display:none}.panel{padding:30px 24px}.panel h2{margin-top:38px}}
  </style>
  <style>.nickname[hidden]{display:none!important}</style>
</head>
<body>
  <main class="shell">
    <section class="intro"><div><div class="brand"><span class="mark">心</span>心晴 AI</div><h1>安全地开始一次对话</h1><p>登录身份用于隔离你的聊天、测评、画像和干预记录，其他用户无法通过修改链接查看你的数据。</p></div><div class="privacy">安全令牌 · 密码加盐哈希 · 用户数据隔离</div></section>
    <section class="panel" id="panel"><a class="back" href="index.html">← 返回首页</a><h2 id="title">欢迎回来</h2><p class="hint" id="hint">登录后进入你的专属陪伴空间</p><div class="tabs"><button class="tab active" type="button" data-mode="login">登录</button><button class="tab" type="button" data-mode="register">注册</button></div><form id="auth-form"><label>账号<input id="account" name="account" autocomplete="username" minlength="3" maxlength="64" required placeholder="请输入账号"></label><label class="nickname" id="nickname-field" hidden>昵称<input id="nickname" name="nickname" autocomplete="nickname" maxlength="30" placeholder="怎么称呼你"></label><label>密码<input id="password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="72" required placeholder="至少 8 位"></label><button class="submit" id="submit" type="submit">登录</button><p class="message" id="message" role="status"></p></form><p class="security">密码只以不可逆加盐哈希保存。登录成功后，用户身份由后端令牌确定，不采用页面传入的用户 ID。</p></section>
  </main>
  <script>
  (()=>{
    const API='http://127.0.0.1:8080',panel=document.getElementById('panel'),form=document.getElementById('auth-form'),message=document.getElementById('message'),submit=document.getElementById('submit');let mode='login';
    const returnTarget=()=>{const target=new URLSearchParams(location.search).get('return')||'app.html';return /^(?![a-z]+:|\/\/)[\w.-]+\.html(?:[?#].*)?$/i.test(target)?target:'app.html'};
    const setMode=value=>{mode=value;const registering=mode==='register';panel.classList.toggle('register-mode',registering);const nicknameField=document.getElementById('nickname-field'),nickname=document.getElementById('nickname');nicknameField.hidden=!registering;nickname.required=registering;document.getElementById('title').textContent=registering?'创建账号':'欢迎回来';document.getElementById('hint').textContent=registering?'注册后即可开始安全对话':'登录后进入你的专属陪伴空间';submit.textContent=registering?'注册并登录':'登录';document.getElementById('password').autocomplete=registering?'new-password':'current-password';document.querySelectorAll('.tab').forEach(tab=>tab.classList.toggle('active',tab.dataset.mode===mode));message.textContent=''};
    document.querySelectorAll('.tab').forEach(tab=>tab.addEventListener('click',()=>setMode(tab.dataset.mode)));
    if(new URLSearchParams(location.search).has('expired'))message.textContent='登录已过期，请重新登录。';
    form.addEventListener('submit',async event=>{event.preventDefault();submit.disabled=true;message.textContent='';const payload={account:document.getElementById('account').value.trim(),password:document.getElementById('password').value};if(mode==='register')payload.nickname=document.getElementById('nickname').value.trim();try{const response=await fetch(`${API}/auth/${mode}`,{method:'POST',headers:{'Content-Type':'application/json',Accept:'application/json'},body:JSON.stringify(payload)});const result=await response.json();if(!response.ok||result.code!==200)throw new Error(result.message||'登录失败');const data=result.data||{};localStorage.setItem('mood_token',data.token);localStorage.setItem('token',data.token);localStorage.setItem('mood_user_id',String(data.userId));localStorage.setItem('mood_user_nickname',data.nickname||'');location.replace(returnTarget())}catch(error){message.textContent=error.message||'暂时无法登录，请稍后重试'}finally{submit.disabled=false}});
  })();
  </script>
</body>
</html>
