server:
  port: 8080
spring:
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:./demo/.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      port: ${REDIS_PORT:6379}
      host: ${REDIS_HOST:localhost}
      database: ${REDIS_DATABASE:1}
aliyun:
  qwen:
    api-key: ${QWEN_API_KEY}

wechat:
  app-id: ${WECHAT_APP_ID:}
  app-secret: ${WECHAT_APP_SECRET:}

security:
  jwt:
    secret: ${JWT_SECRET}

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case:  true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto

moodapp:
  demo-mode: ${MOODAPP_DEMO_MODE:false}
  cors:
    allowed-origins: ${FRONTEND_ALLOWED_ORIGINS:http://127.0.0.1:5500,http://localhost:5500}
  agent:
    base-url: ${MOODAPP_AGENT_BASE_URL:http://127.0.0.1:8081}
    gateway-token: ${MOODAPP_AGENT_GATEWAY_TOKEN:}
